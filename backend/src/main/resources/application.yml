server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      max-lifetime: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  exercise:
    image-base-url: ${EXERCISE_IMAGE_BASE_URL:https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/}
  statement:
    tmp-dir: ${java.io.tmpdir}
    tesseract-command: tesseract
    ocr-page-timeout-seconds: 120
    job-deadline-minutes: 6
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    base-url: https://generativelanguage.googleapis.com/v1beta
    connect-timeout-seconds: 10
    read-timeout-seconds: 60
    max-output-tokens: 1024
    temperature: 0.3
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000}
management:
  endpoints:
    web:
      exposure:
        include: health
