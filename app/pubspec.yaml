name: ai_life_tracker
description: "AI Life Tracker - Complete Personal Finance, Fitness, Mood, and AI Insights"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  video_player: ^2.8.1
  intl: ^0.19.0
  flutter_sms_inbox: ^1.0.3
  permission_handler: ^11.3.1
  file_picker: ^8.1.4
  fl_chart: ^0.68.0
  pedometer: ^4.0.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  flutter_timezone: ^2.0.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
